---
layout: default
---
<!--
  Generic content page: just a title (from front matter) plus whatever
  markdown/HTML you wrote below the "---" of the page using this layout.
  Used by resume listing pages like blog.md/projects.md/reviews.md, and by
  anything else you add later that doesn't need its own specialized layout.
-->
<article class="page">
  <h1>{{ page.title }}</h1>
  {{ content }}
</article>
